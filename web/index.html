<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제스처 이펙트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>제스처 이펙트</h1>
    <p>학습한 제스처를 인식하면 화면에 효과를 띄웁니다.</p>
  </header>

  <main>
    <section class="stage">
      <canvas id="view" width="1280" height="720"></canvas>
      <div id="placeholder">웹캠을 켜거나 동영상/사진을 여세요</div>
    </section>

    <aside>
      <div class="controls">
        <button id="cameraBtn" class="primary">📷 웹캠</button>
        <button id="fileBtn">📁 동영상/사진 열기</button>
        <button id="sampleBtn" title="nike·ok 동작이 없는 영상입니다">🎬 예제 영상</button>
        <button id="stopBtn">■ 정지</button>
        <input id="fileInput" type="file" accept="video/*,image/*" hidden>
      </div>

      <label class="score">
        <span>최소 확률 <b id="scoreText">0.70</b></span>
        <input id="scoreRange" type="range" min="0.3" max="0.99" step="0.01" value="0.7">
      </label>

      <div class="card">
        <h2>인식 결과</h2>
        <div id="effectPreview" class="preview"><span class="empty">인식된 효과 없음</span></div>
        <div id="resultText" class="result">-</div>
      </div>

      <div class="card">
        <h2>효과</h2>
        <ul id="legend"></ul>
        <p id="modelLabels" class="muted"></p>
      </div>

      <p id="status" class="muted">불러오는 중...</p>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
